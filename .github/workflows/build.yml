name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Gradle project folder
        id: find
        run: |
          SETTINGS=$(find . -name "settings.gradle*" -not -path "*/.git/*" -not -path "*/build/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle မတွေ့ပါ"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Gradle project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check gradlew
        run: |
          if [ ! -f ./gradlew ]; then
            echo "root မှာ gradlew မတွေ့ပါ"
            ls -la
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew -p "${{ steps.find.outputs.dir }}" assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
