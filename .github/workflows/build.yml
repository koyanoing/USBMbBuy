name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # v3 ကနေ v4 ပြောင်းလိုက်ပါ

      - name: Set up JDK 17
        uses: actions/setup-java@v4  # v3 ကနေ v4 ပြောင်းလိုက်ပါ
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4  # v3 ကနေ v4 ပြောင်းလိုက်ပါ (အဓိက Error ဖြစ်နေရာ)
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
