name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Gradle project folder
        id: find
        run: |
          SETTINGS=$(find . -name "settings.gradle*" -not -path "*/.git/*" -not -path "*/build/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle မတွေ့ပါ"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Gradle project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle wrapper
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          if [ ! -f "$DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar မတွေ့ပါ: $DIR/gradle/wrapper/"
            ls -la "$DIR/gradle/wrapper/" || true
            exit 1
          fi
          if [ ! -f "$DIR/gradlew" ]; then
            echo "gradlew မတွေ့ပါ: $DIR/"
            ls -la "$DIR/"
            exit 1
          fi
          chmod +x "$DIR/gradlew"

      - name: Build APK with Gradle
        working-directory: ${{ steps.find.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
